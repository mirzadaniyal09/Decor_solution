<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UBL bank">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B2F2A"/>
      <stop offset="1" stop-color="#0A7C66"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" rx="48" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1040" cy="120" r="120" fill="rgba(255,255,255,0.10)"/>
  <circle cx="980" cy="500" r="180" fill="rgba(255,255,255,0.08)"/>

  <!-- Card -->
  <g filter="url(#shadow)">
    <rect x="90" y="90" width="1020" height="420" rx="36" fill="url(#card)" stroke="rgba(255,255,255,0.18)"/>
  </g>

  <!-- Simple bank icon (generic, not a logo) -->
  <g transform="translate(170,170)">
    <path d="M220 0L440 110V140H0V110L220 0Z" fill="rgba(255,255,255,0.92)"/>
    <rect x="40" y="160" width="60" height="180" rx="10" fill="rgba(255,255,255,0.88)"/>
    <rect x="140" y="160" width="60" height="180" rx="10" fill="rgba(255,255,255,0.88)"/>
    <rect x="240" y="160" width="60" height="180" rx="10" fill="rgba(255,255,255,0.88)"/>
    <rect x="340" y="160" width="60" height="180" rx="10" fill="rgba(255,255,255,0.88)"/>
    <rect x="0" y="350" width="440" height="70" rx="14" fill="rgba(255,255,255,0.92)"/>
  </g>

  <!-- Text -->
  <text x="640" y="270" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="72" font-weight="800" fill="rgba(255,255,255,0.96)">UBL Bank</text>
  <text x="640" y="330" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="28" font-weight="600" fill="rgba(255,255,255,0.78)">Bank deposit / transfer instructions</text>

  <!-- Small footer note -->
  <text x="640" y="460" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="rgba(255,255,255,0.70)">Replace this image with an official bank slip/photo anytime</text>
</svg>
